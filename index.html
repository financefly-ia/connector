<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Financefly Connector — Pluggy</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.pluggy.ai/pluggy-connect/latest/pluggy-connect.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>

    <!-- HERO SIMPLES (temporário só para não quebrar layout) -->
    <header class="hero">
      <h1>Financefly Connector</h1>
      <p>Conecte sua conta de forma segura</p>
    </header>

    <!-- FORMULÁRIO -->
    <main>
      <section class="panel">
        <form id="connect-form">
          <label>
            Nome:
            <input id="user-name" type="text" autocomplete="name" />
          </label>

          <label>
            E-mail:
            <input id="user-email" type="email" autocomplete="email" />
          </label>

          <button id="connect-btn" type="submit">
            Iniciar conexão financeira
          </button>
        </form>
      </section>

      <!-- STATUS -->
      <section class="panel">
        <h2>Status</h2>
        <p><strong>Item ID:</strong> <span id="item-id">Nenhuma conexão ainda</span></p>
        <p id="item-updated">Aguardando a finalização.</p>

        <p>Status atual:</p>
        <span id="status-chip" data-state="idle">Aguardando ação</span>
      </section>

      <!-- LOGS -->
      <section>
        <button id="log-toggle" type="button">Mostrar logs</button>

        <div id="log-container" hidden>
          <ul id="log-stream"></ul>
        </div>
      </section>
    </main>

  </body>
</html>
